<div class="ion-margin">
  <ion-list class="ion-padding-horizontal">

    <ion-row class="ion-margin-bottom">
      <ion-input
        type="password"
        label="Current Password"
        label-placement="floating"
        fill="outline"
        [(ngModel)]="deleteData().password"
        name="password"
        #password="ngModel"
        required
        errorText="Password is required"
        >
      </ion-input>

      @if (errors()['password']) {
        <ion-text class="ion-margin-start" color="danger">
          <small>{{ errors()['password'] }}</small>
        </ion-text>
      } @else if(errors()['error']) {
        <ion-text class="ion-margin-start" color="danger">
          <small>{{ errors()['error'] }}</small>
        </ion-text>
      }
    </ion-row>

    <ion-row class="ion-margin-bottom">
      <ion-input
        type="password"
        label="Confirm Password"
        label-placement="floating"
        fill="outline"
        [(ngModel)]="deleteData().confirmPassword"
        name="confirmPassword"
        #confirmPassword="ngModel"
        required
        errorText="Must not be empty"
        >
      </ion-input>

      @if (!passwordsMatch()) {
        <ion-text class="ion-margin-start" color="danger">
          <small>The passwords don't match</small>
        </ion-text>
      }
    </ion-row>

    <ion-row class="ion-justify-content-center">
      <ion-button fill="outline" color="danger" (click)="onSubmit()">
        Delete Account
      </ion-button>
    </ion-row>

  </ion-list>
</div>
